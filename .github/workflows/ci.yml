name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 scripts/check-licenses.py
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-compose-docs.py
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgres://atlas:synthetic-app-ci-only@localhost:5432/atlas_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Initialize unprivileged test database role
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: atlas_test
          ATLAS_DATABASE_PASSWORD: synthetic-app-ci-only
          PGHOST: 127.0.0.1
          PGPASSWORD: synthetic-ci-only
        run: sh ../deploy/postgres/01-app-role.sh
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Measure synthetic replay profiles without a latency gate
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/ledger -run '^$' -bench '^BenchmarkReplaySyntheticHistory$' -benchtime=100ms -count=1
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit
  identity-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://atlas:synthetic-app-ci-only@127.0.0.1:5432/atlas?sslmode=disable
      ATLAS_ADDR: 127.0.0.1:8080
      ATLAS_ORIGIN: http://127.0.0.1:5173
      ATLAS_INSECURE_HTTP: 'true'
      ATLAS_REGISTRATION: 'true'
      ATLAS_E2E_ORIGIN: http://127.0.0.1:5173
      ATLAS_E2E_TEST_INSTANCE: 'true'
      ATLAS_E2E_API_ORIGIN: http://127.0.0.1:8080
      ATLAS_E2E_HEALTHCHECK: /tmp/atlas-healthcheck-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Initialize unprivileged application role in disposable CI database
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: atlas
          POSTGRES_PASSWORD: synthetic-ci-only
          ATLAS_DATABASE_PASSWORD: synthetic-app-ci-only
          PGHOST: 127.0.0.1
          PGPASSWORD: synthetic-ci-only
        run: sh deploy/postgres/01-app-role.sh
      - run: go build -o /tmp/atlas-healthcheck-e2e ./cmd/healthcheck
        working-directory: backend
      - run: go build -o /tmp/atlas-identity-e2e ./cmd/atlas
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify browser, API and PostgreSQL integration
        env:
          ATLAS_E2E_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        working-directory: web
        run: |
          /tmp/atlas-identity-e2e > /tmp/atlas-identity-e2e.log 2>&1 &
          api_pid=$!
          npm run dev > /tmp/atlas-web-e2e.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          npm run test:e2e
          npm run test:portfolio
          npm run test:brokers
          npm run test:reconciliation
          npm run test:market-status
          npm run test:keyboard
          npm run test:quote-history
          npm run test:purchase-preview
          npm run test:account-holdings
          npm run test:asset-operations
          npm run test:portfolio-history
          npm run test:portfolio-allocation
          npm run test:asset-catalogue
          npm run test:a11y
          npm run test:readiness

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/${{ matrix.arch }} -f backend/Dockerfile -t atlas-ci:${{ matrix.arch }} .
      - name: Verify shipped license notices
        run: |
          container_id=$(docker create --platform linux/${{ matrix.arch }} atlas-ci:${{ matrix.arch }})
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/web/licenses" "${{ runner.temp }}/atlas-notices"
          python3 scripts/check-licenses.py --artifact-dir "${{ runner.temp }}/atlas-notices"
      - name: Verify fresh Compose installation and encrypted recovery
        if: matrix.arch == 'amd64'
        run: |
          docker pull postgres:18.6
          python3 scripts/verify-instance.py --image atlas-ci:amd64 --work-dir "${{ runner.temp }}/atlas-instance-check"
