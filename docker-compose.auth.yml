# Optional authentication stack: requires an explicit origin and database password.
services:
  api:
    environment:
      DATABASE_URL: "postgres://atlas:${ATLAS_DATABASE_PASSWORD:?Set ATLAS_DATABASE_PASSWORD}@db:5432/atlas?sslmode=disable"
      ATLAS_ORIGIN: "${ATLAS_ORIGIN:?Set ATLAS_ORIGIN}"
      ATLAS_INSECURE_HTTP: "${ATLAS_INSECURE_HTTP:-false}"
      ATLAS_REGISTRATION: "${ATLAS_REGISTRATION:-false}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6
    environment:
      ATLAS_DATABASE_PASSWORD: "${ATLAS_DATABASE_PASSWORD:?Set ATLAS_DATABASE_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - atlas_database:/var/lib/postgresql
      - ./deploy/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  atlas_database:
